name: Migration smoke

# Typecheck, lint, tests, build, bundle budget and the browser smoke run on
# ServerHoster (.survhub/ci.yml). This job stays on GitHub Actions because it
# needs Docker for `supabase start`, which ServerHoster CI jobs do not get.
# The repo is public, so it does not use paid minutes, and it only does real
# work when supabase/migrations changed.

on:
  # Every branch, not just `main`. A feature branch that only runs CI once a
  # pull request exists is a branch you can leave broken for days — and a
  # merged PR cannot be reused to re-run anything.
  push:
  pull_request:

# A pull request from a branch in this repo fires both events. Keying the group
# on the head branch puts both runs in the same group, so the second supersedes
# the first instead of duplicating it. `ref_name`, not `ref`: a push gives
# `refs/heads/foo` where a pull request gives `foo`, which is a different group
# and defeats the whole point.
concurrency:
  group: migration-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migration smoke
    runs-on: ubuntu-latest
    steps:
      # The default shallow checkout has no `origin/<base>` to diff against, so
      # the detection step below could only ever fail and skip. Full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # On a pull request, compare against its base. On a push to a feature
          # branch, compare against where it left the default branch, so every
          # migration the branch adds is covered however many times you push. On
          # a push to the default branch itself, compare against the previous tip.
          if [ "$EVENT" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
          elif [ "${GITHUB_REF#refs/heads/}" = "$DEFAULT_BRANCH" ]; then
            BASE="$BEFORE"
          else
            BASE=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || true)
          fi

          # A base we cannot resolve means we cannot prove the migrations are
          # untouched. Run the smoke rather than skip it — a skipped check that
          # looks green is worse than a slow one.
          if [ -z "$BASE" ] || ! git rev-parse --verify -q "$BASE^{commit}" >/dev/null; then
            echo "No usable diff base; running the migration smoke."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...HEAD" | grep -q '^supabase/migrations/'; then
            echo "Migrations changed since $BASE."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No migration changes since $BASE."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.changed.outputs.run == 'true'
        with:
          version: latest

      - name: Apply migrations against a fresh database
        if: steps.changed.outputs.run == 'true'
        run: |
          supabase start
          supabase db reset --local

      - name: Run schema assertions
        if: steps.changed.outputs.run == 'true'
        run: psql "$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '\"')" -v ON_ERROR_STOP=1 -f supabase/tests/schema_assertions.sql
