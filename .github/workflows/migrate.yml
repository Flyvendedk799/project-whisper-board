name: Migrate database

# Applies new files in supabase/migrations/ to the production database when they land
# on main. Production Postgres runs in a container on the VPS (boared.online is
# self-hosted), so this does not use the Supabase CLI or supabase.com: it sends the
# migrations over SSH to /usr/local/sbin/boared-migrate, which applies only what the
# tracker (supabase_migrations.schema_migrations) is missing, each in its own
# transaction, after taking a pg_dump backup. See supabase/README.md.
#
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   MIGRATE_SSH_KEY          private key; on the VPS it is limited to a forced command
#                            that can only run `check` or `apply`
#   MIGRATE_SSH_HOST         VPS address
#   MIGRATE_SSH_KNOWN_HOSTS  the VPS host key, so the host is verified

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# Never run two pushes against the database at once, and never cancel one midway.
concurrency:
  group: migrate-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings -> Environments) if you
    # want a manual approval gate before production is touched.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          KEY: ${{ secrets.MIGRATE_SSH_KEY }}
          HOST: ${{ secrets.MIGRATE_SSH_HOST }}
          KNOWN_HOSTS: ${{ secrets.MIGRATE_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Set MIGRATE_SSH_KEY, MIGRATE_SSH_HOST and MIGRATE_SSH_KNOWN_HOSTS as repository secrets."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_migrate && chmod 600 ~/.ssh/id_migrate
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User administrator\n  IdentityFile ~/.ssh/id_migrate\n  IdentitiesOnly yes\n  BatchMode yes\n  StrictHostKeyChecking yes\n' "$HOST" > ~/.ssh/config

      - name: Show pending migrations (dry run)
        run: tar -c -C supabase/migrations . | ssh vps check

      - name: Apply
        run: tar -c -C supabase/migrations . | ssh vps apply

      - name: Verify nothing is left pending
        run: tar -c -C supabase/migrations . | ssh vps check | tee /dev/stderr | grep -q '^up to date$'
