name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # bun.lock pins packages to Lovable's private registry mirror, which is
      # only reachable from their sandbox. CI resolves from public npm instead,
      # so it runs anywhere. Swap this for `bun install` once the lockfile is
      # regenerated against a registry GitHub can reach.
      - name: Install dependencies
        run: npm install --no-package-lock --registry=https://registry.npmjs.org

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # A budget, not a report: a size regression should fail the build rather
      # than scroll past in a summary. The client output moved from dist/client
      # to .output/public when the Lovable scaffolding gained nitro, so resolve
      # it rather than assume — and fail loudly if neither exists, because a
      # silently-empty total would make this check pass forever.
      - name: Check bundle budget
        run: |
          BUDGET_KB=1200
          DIR=$(ls -d .output/public dist/client 2>/dev/null | head -1)
          if [ -z "$DIR" ]; then
            echo "::error::No client build output in .output/public or dist/client."
            exit 1
          fi
          TOTAL=$(find "$DIR" -name '*.js' -printf '%s\n' | awk '{s+=$1} END {printf "%d", s/1024}')
          echo "### Client bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "Total JS in \`$DIR\`: **${TOTAL} KB** of ${BUDGET_KB} KB budget" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find "$DIR" -name '*.js' -printf '%s\t%p\n' \
            | sort -rn | head -12 | awk '{printf "%8.1f KB  %s\n", $1/1024, $2}' \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -gt "$BUDGET_KB" ]; then
            echo "::error::Client JS is ${TOTAL} KB, over the ${BUDGET_KB} KB budget."
            exit 1
          fi

  e2e:
    name: Browser smoke
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-package-lock --registry=https://registry.npmjs.org
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  migrations:
    name: Migration smoke
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect migration changes
        id: changed
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^supabase/migrations/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.changed.outputs.run == 'true'
        with:
          version: latest

      - name: Apply migrations against a fresh database
        if: steps.changed.outputs.run == 'true'
        run: |
          supabase start
          supabase db reset --local

      - name: Run schema assertions
        if: steps.changed.outputs.run == 'true'
        run: psql "$(supabase status -o env | grep DB_URL | cut -d= -f2- | tr -d '\"')" -v ON_ERROR_STOP=1 -f supabase/tests/schema_assertions.sql
